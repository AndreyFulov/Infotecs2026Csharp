services:
#  infotecstestapplication:
#    image: infotecstestapplication
#    build:
#      context: .
#      dockerfile: InfotecsTestApplication/Dockerfile
  postgres:
    image: postgres:17
    container_name: infotecs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: infotecs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4
    container_name: infotecs-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: